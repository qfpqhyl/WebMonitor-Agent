server:
    interface: 127.0.0.1
    # Only fixture. forwards to Docker's loopback resolver in this smoke overlay.
    do-not-query-localhost: no
    port: 53
    do-daemonize: no
    username: ""
    chroot: ""
    directory: "/tmp"
    pidfile: "/tmp/unbound.pid"
    use-syslog: no
    logfile: ""
    verbosity: 0
    log-queries: no
    log-replies: no
    access-control: 127.0.0.0/8 allow
    hide-identity: yes
    hide-version: yes
    module-config: "iterator"
    tls-cert-bundle: "/etc/ssl/certs/ca-certificates.crt"
    cache-max-ttl: 60
    serve-expired: no
    edns-buffer-size: 1232
    max-udp-size: 1232

forward-zone:
    name: "."
    forward-tls-upstream: yes
    forward-first: no
    forward-addr: "1.1.1.1@853#cloudflare-dns.com"
    forward-addr: "9.9.9.9@853#dns.quad9.net"

# The smoke-only fixture remains Docker-local; no other private namespace is forwarded.
forward-zone:
    name: "fixture."
    forward-tls-upstream: no
    forward-first: no
    forward-addr: 127.0.0.11
