# DNS-resolving destination ACLs are evaluated by Squid, not just the caller.
# Do not add '-n': DNS answers, including mixed public/private answers, must be checked.
http_port 3128
visible_hostname webmonitor-egress
acl safe_ports port 80 443
acl tls_ports port 443
acl tunnel method CONNECT
acl web_protocol proto HTTP HTTPS
acl forbidden_names dstdomain -n .localhost metadata metadata.google.internal host.docker.internal
acl forbidden_v4 dst 0.0.0.0/8 10.0.0.0/8 100.64.0.0/10 127.0.0.0/8 169.254.0.0/16 172.16.0.0/12
acl forbidden_v4 dst 192.0.0.0/24 192.0.2.0/24 192.88.99.0/24 192.168.0.0/16 198.18.0.0/15 198.51.100.0/24 203.0.113.0/24 224.0.0.0/3
# Squid's overlap comparator aliases IPv4 with low IPv6 ranges. Keep separate
# splay trees and exclude ::ffff:0:0/96 from IPv6 so public IPv4 stays usable.
acl forbidden_v6 dst ::-::fffe:ffff:ffff ::1:0:0:0-1fff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
# Remaining non-global-unicast and global special-use IPv6 ranges.
acl forbidden_v6 dst 4000::/2 8000::/1 2001::/23 2001:db8::/32 2002::/16 3fff::/20
acl smoke_fixture_url url_regex ^http://fixture:8000/
acl smoke_fixture_host dstdomain -n fixture
acl smoke_fixture_port port 8000
http_access allow smoke_fixture_url smoke_fixture_host smoke_fixture_port !tunnel
http_access deny manager
http_access deny !safe_ports
http_access deny tunnel !tls_ports
http_access deny !tunnel !web_protocol
http_access deny forbidden_names
http_access deny forbidden_v4
http_access deny forbidden_v6
http_access allow all
# Recheck DNS-resolved destinations at forwarding; never forward a private cache miss.
miss_access allow smoke_fixture_url smoke_fixture_host smoke_fixture_port !tunnel
miss_access deny forbidden_names
miss_access deny forbidden_v4
miss_access deny forbidden_v6
miss_access allow all
host_verify_strict on
pinger_enable off
# No peers, response cache, stale DNS serving, or connection pooling across requests.
cache deny all
server_persistent_connections off
client_persistent_connections off
# The smoke resolver forwards only fixture. to Docker DNS; all other names use TLS.
dns_nameservers 127.0.0.1
positive_dns_ttl 60 seconds
negative_dns_ttl 1 seconds
connect_timeout 5 seconds
forward_timeout 30 seconds
connect_retries 0
# Permit one alternate resolved address when Docker has no IPv6 route.
# Destination ACLs and the 30-second total forwarding deadline still apply.
forward_max_tries 2
request_timeout 30 seconds
shutdown_lifetime 1 seconds
cache_mem 0 MB
maximum_object_size 0 KB
pid_filename /tmp/squid.pid
coredump_dir /tmp
cache_log /dev/stderr
access_log none
cache_store_log none
logfile_rotate 0
forwarded_for delete
via off
