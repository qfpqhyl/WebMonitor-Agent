# Host environment (macOS / Windows / Linux).
# Create: conda env create --file environment.yml
# Activate: conda activate webmonitor-agent
# Docker Desktop and Node.js tooling are installed separately.
name: webmonitor-agent
channels:
  - defaults
dependencies:
  - python=3.12
  - pip
  - pip:
      - --require-hashes
      - -rrequirements-dev.txt
