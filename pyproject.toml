[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "webmonitor-agent"
version = "0.1.0"
description = "AI-driven web monitoring application"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.110,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2,<3",
  "pydantic-settings>=2,<3",
  "httpx>=0.27,<1",
  "sqlalchemy[asyncio]>=2,<3",
  "alembic>=1,<2",
  "asyncpg>=0.29,<1",
  "playwright>=1.49,<2",
  "boto3>=1,<2",
  "openai>=3,<4",
  "openai-agents==0.22.3",
  "mcp==2.2.0",
  "argon2-cffi>=23.1,<26",
  "beautifulsoup4>=4.12,<5",
  "lxml>=5,<7",
  "email-validator>=2.2,<3",
  "jinja2>=3.1,<4",
  "aiosmtplib>=3,<6",
  "nh3>=0.2,<1",
]

[project.scripts]
webmonitor = "webmonitor.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "pytest-cov>=6,<8", "ruff>=0.9,<1", "mypy>=1,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/webmonitor"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
asyncio_mode = "strict"
